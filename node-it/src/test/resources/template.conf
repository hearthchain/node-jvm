waves {
  blockchain.type = CUSTOM
  directory = /tmp/waves
  ntp-server = "" # Predictable local time
  network {
    known-peers = []
    black-list-residence-time = 30s
    peers-broadcast-interval = 2s
    connection-timeout = 30s
    suspension-residence-time = 5s

    traffic-logger {
      ignore-tx-messages = [1, 2]
      ignore-rx-messages = [1, 2]
    }
  }
  synchronization {
    utx-synchronizer.max-queue-size = 20000
    invalid-blocks-storage.timeout = 100ms
  }
  blockchain {
    type = CUSTOM
    custom {
      address-scheme-character = I
      functionality {
        feature-check-blocks-period = 1
        blocks-for-feature-activation = 1
        generation-balance-depth-from-50-to-1000-after-height = 0
        reset-effective-balances-at-height = 0
        block-version-3-after-height = 0
        last-time-based-fork-parameter = 0
        double-features-periods-after-height = 100000000
        max-transaction-time-back-offset = 120m
        max-transaction-time-forward-offset = 90m
        # Only feature id 1 (BlockchainFeatures.SmallerMinimalGeneratingBalance) still exists in this fork; the rest
        # of the old Waves feature set (smart accounts, NG, sponsorship, etc.) was removed along with it, so none of
        # them can be pre-activated any more (the node refuses to run on a chain that activated a feature it doesn't
        # implement).
        pre-activated-features = {}
        min-block-time = 5s
        delay-delta = 0
        # Large enough that no node-it suite's run ever crosses a period boundary: genesis commits every miner-eligible
        # node (nodes.conf's node01-node09) only for the first generation period, and nothing here ever sends a
        # CommitToGenerationTransaction to renew that commitment for a later one, so mining would otherwise halt once
        # the chain crossed into an uncommitted period.
        generation-period-length = 1000000
      }
      rewards {
        term = 100000
        term-after-capped-reward-feature = 50000
        initial = 600000000
        min-increment = 50000000
        voting-interval = 10000
      }
      # These fields are ignored: timestamp, block-timestamp, signature. They are generated in integration tests.
      # state-hash/block-id are unpinned (custom-defaults.conf's placeholders must not leak through) since this
      # network's genesis differs per test run.
      genesis {
        average-block-delay = 10s
        initial-base-target = 50000
        state-hash = null
        block-id = null
      }
      predefined-snapshots = [
        {
          height = 1
          # Pre-issued assets for tests that need an existing non-WAVES asset (there is no issue transaction any
          # more, so a test can no longer mint one at runtime). Fully distributed below, between the "firstKeyPair"
          # and "secondKeyPair" fixture accounts (see IntegrationSuiteWithThreeAddresses), since a trade needs both
          # sides to already hold what they sell.
          assets = [
            {
              id = 7cace92d77062883e346c71dbf4db00179896879a271c90b1335fa0421605754
              issuer = d08bb9e6577716a1393c1d1e0a3ce71cb2c1fecd63ca6acffc1e4261dbc5892b
              name = "GenesisTestAsset"
              decimals = 8
              quantity = 1000000000000000
              description = "node-it-fixture-asset"
              reissuable = false
            }
            {
              id = 8cfe2930adce25be213f05b9e62dcf9e66d189eb9fa964e8603864d7a710fde4
              issuer = d08bb9e6577716a1393c1d1e0a3ce71cb2c1fecd63ca6acffc1e4261dbc5892b
              name = "GenesisTestNFT"
              decimals = 0
              quantity = 1
              description = "node-it-fixture-NFT"
              reissuable = false
            }
          ]
          # One committed generator per miner-eligible node (nodes.conf's node01-node09; node10 stays a plain,
          # non-mining account). Each generator's signing key is the same key as its node's own account (see
          # nodes.conf's account-seed/public-key/address), so the node that mines is also a regular funded account;
          # the VRF and BLS keys are independent, arbitrary keys configured alongside it in waves.miner.accounts.
          generators = [
            { public-key = d08bb9e6577716a1393c1d1e0a3ce71cb2c1fecd63ca6acffc1e4261dbc5892b, endorser-public-key = 9289a153a78005a3c699db7c5627df44786dc49a8faf0792bf254c9726729ce189f3464332d1bfdf36139ec39e62324b, vrf-public-key = e1fb0436d623496cd7bd323d0e7b5c0f471652320bfa612571b81777d8645e02 }
            { public-key = d635911564704e53fd495984da06687461577f6f4f6281197b3e42df851266d8, endorser-public-key = a6599a6cd1b4cd4c10c6998ed27ba4ad5bf1ac4e3ed4f7ce3e366305e60e21b79db29afc268300b0a0c8a13fd3cb0252, vrf-public-key = 7ef44069de7e4378702fe5c2d58357461e01cfd70776285198142f46d20bdb80 }
            { public-key = 6740e30fc856d5cc64839576367ef9aeec3a0fe3cd49d31b19934e7b09d53a19, endorser-public-key = b8d0e1d0e17cdea1eb5f87f671ea89f17035b8600413920e2feba2ae83a5a83631edb5a4a6df309c432ff8114ab0d03a, vrf-public-key = 786680d4b218616fbab6e61e2bff5e81427cfe16141dd7415fe5d45a39dbd7b9 }
            { public-key = eb996e35de0595f1002ae292b92468a4e41b91c11d80cdc45544170a20dab254, endorser-public-key = 8243259576d9793ddc7ad669d30d7020ffbde1b1fa820312514944838cd1a2f34c639e1749ba7560a4e4b66449a9ddd0, vrf-public-key = 80f50c4f3814f7d8cc649cb1b3a07ce2e08bc7775a365441da2a67e71ce60269 }
            { public-key = de83abbfc408a6776b43de1c53cdcc6a53cbcab66977739648b64dca6a7268fb, endorser-public-key = 851cf0d176dc5b55ce7b040dc80c65406ce447625a965b0cb5a14c6cb43c652231c37a84e0b819f2573aa3117426c713, vrf-public-key = 4809fe04cde239ec22056d9186a8700c3b7058a333957abbe46107d91f63fa69 }
            { public-key = 4c6771262dbd99749b37e99ada7edf13cc5c8e3f2c4a05827b64f063daae5123, endorser-public-key = 9172923308c659a07ef416d9fcaaf087c7beb3c86472ca80dc5bcf12bb9d9f25d04e5b0ac943b44c1b68e568fd6bb3f7, vrf-public-key = c640c706b3048c4163dcce9d2d8587c3343aa0c5822bddb0dc4636c2ae14ebae }
            { public-key = 6374525524509ea4398caae0d3d439d1879ff3a75414bb9fdcc1c351056cb7f5, endorser-public-key = 95100e4e846fe6e777ad603bd58d1bc929a8fd7ee6a05896e7fe103eb8e45bb36e33c0648d78335141111f6396745fa0, vrf-public-key = 989daf3fd9d9e4b14433985745d2b9ab4328fe4c953f135d1c622baa63826d4f }
            { public-key = a9be5ccd77b0e2ff848e37213895eff2eb4f31632b052ac0351d027f5b6a8cc9, endorser-public-key = aea2730e9bb63029d308869c22eac360af0a1602cae6157aa4f9840ac01651a4885f1a9a18ec72193c7bd634d863c69c, vrf-public-key = 880ccf2da0d1c74ab40b2100b556372b40f64a8d30ecfde580aaac3ac122d6a7 }
            { public-key = f01aa92a8c0f2101dd115b1299930cb189552d032ffb00db5435ab3ef82e746e, endorser-public-key = b4bbd8ee2fd5e8906778fde76a1915dcb79f69727d6749111d4ec4881d5269147996faf0c697002d33c190bc6b05b8cd, vrf-public-key = 95555978c9b15c8ea503a6f6fe87636f4a8132ae01e764078aed084b14e3e04b }
          ]
          balances = [
            # Initial balances are balanced (pun intended) in such way that initial block
            # generation delay doesn't vary much, no matter which node is chosen as a miner.
            { recipient = thrth10t0p8gv7rrvp6ll06p5vwh2k9ajg7rwse9euye, waves =   10000000000000 } # node01
            { recipient = thrth1spwnjml8qd2psgmx7cf00q4fkjp9z5pjkv4p20, waves =   15000000000000 } # node02
            { recipient = thrth1cp9d5vzsd0e247r6jz3c3gava3234awk20gkgz, waves =   25000000000000 } # node03
            { recipient = thrth14hxec7pd5wfdpxd6hmemlj6khe3e8m8ysgdnsw, waves =   25000000000000 } # node04
            { recipient = thrth10n2ervuy77sg5a67sjch5f7gzy7ju0v3ht82je, waves =   40000000000000 } # node05
            { recipient = thrth1rhnvgg9xj0x22mwhumxn37nfj64px9nt73hfhe, waves =   45000000000000 } # node06
            { recipient = thrth1ym8e372q5gchmz22awe304juatemp056r59hna, waves =   60000000000000 } # node07
            { recipient = thrth1hxq2mzds0ew9uxsvrzlk0dpphd6cwlydtkunzp, waves =   80000000000000 } # node08
            { recipient = thrth1n5wdnt28q9q2g4ekklzgx93t6he5uajgyntvc8, waves =  100000000000000 } # node09
            { recipient = thrth1ss5mvtumrzg7htpwfuwxv2347cuhfv98xu822l, waves = 6000000000000000 } # node10

            # "firstKeyPair"/"secondKeyPair" fixture accounts (IntegrationSuiteWithThreeAddresses); the shared
            # genesis test asset is split between them so each side of a trade already holds what it sells.
            {
              recipient = thrth1f4nr8acg9fpsssdwwln0ugpde5zcktqwlg0fff
              assets = {
                7cace92d77062883e346c71dbf4db00179896879a271c90b1335fa0421605754 = 500000000000000
                8cfe2930adce25be213f05b9e62dcf9e66d189eb9fa964e8603864d7a710fde4 = 1
              }
            }
            {
              recipient = thrth1pj3t8ekhlpxh0d06lme4t0lekvvhcnw7mykdg3
              assets = {
                7cace92d77062883e346c71dbf4db00179896879a271c90b1335fa0421605754 = 500000000000000
              }
            }
          ]
        }
      ]
    }
  }
  features.auto-shutdown-on-unsupported-feature = no
  miner {
    enable = yes
    quorum = 1
    interval-after-last-block-then-generation-is-allowed = 1h
    min-micro-block-age = 0s
    micro-block-interval = 1s
  }
  rest-api {
    enable = yes
    bind-address = 0.0.0.0
    api-key-hash = 019f122df053dc5f7c3273922017ff4c23750689d78988e10302310256efc8ef # integration-test-rest-api
    minimum-peers = 0
  }
  wallet {
    file = "wallet"
    password = test
  }
  utx {
    max-scripted-size = 100000
    allow-skip-checks = false
  }
  extensions = [
    tech.hearth.api.grpc.GRPCServerExtension
  ]
  grpc {
    host = 0.0.0.0
    port = 6870
  }
}

pekko.actor.debug {
  lifecycle = on
  unhandled = on
}
