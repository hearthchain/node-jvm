syntax = "proto3";
package hearth.api;
option java_package = "tech.hearth.database.protobuf";

import "hearth/block.proto";
import "hearth/transaction.proto";
import "hearth/amount.proto";
import "hearth/recipient.proto";
import "hearth/transaction_state_snapshot.proto";

message AssetVolumeDetails {
  bytes total_volume = 1;
}

message BlockMeta {
  Block.Header header = 1;
  bytes signature = 2;
  bytes header_hash = 3;
  int32 height = 4;
  int32 size = 5;
  int32 transaction_count = 6;
  repeated Amount total_fee = 7;
  repeated Amount carry_fee = 8;
  int64 reward = 9;
  bytes vrf = 10;
  bytes total_score = 11;
  int64 total_hearth_amount = 12;
}

message TransactionMeta {
  int32 height = 1;
  int32 num = 2;
  int32 type = 3;
  TransactionStatus status = 4;
  int64 spent_complexity = 5;
  int32 size = 6;
}

message EthereumTransactionMeta {
  message Invocation {
    bytes function_call = 1;
    repeated Amount payments = 2;
  }
  message Transfer {
    bytes public_key_hash = 1;
    Amount amount = 2;
  }
  oneof payload {
    Invocation invocation = 1;
    Transfer transfer = 2;
  }
}

message TransactionData {
  oneof transaction {
    bytes legacy_bytes = 1;
    SignedTransaction hearth_transaction = 2;
    bytes ethereum_transaction = 5;
  }
  TransactionStatus status = 3;
  int64 spent_complexity = 4;
}

message AccountScriptInfo {
  message ComplexityByVersion {
    int32 version = 1;
    map<string, int64> callable_complexity = 2;
  }

  bytes public_key = 1;
  bytes script_bytes = 2;
  int64 max_complexity = 3;
  repeated ComplexityByVersion callable_complexity = 4;
}

message StaticAssetInfo {
  // field 1 (source_id) retired: it always equalled the asset's own id, since nothing issues an asset via a
  // real transaction any more
  // field 2 (issuer_public_key) retired: nothing checks who issued an asset any more (no Reissue/Burn/SponsorFee
  // to gate by it)
  int32 decimals = 3;
  // field 4 (is_nft) retired: no remaining consumer once NFT-portfolio-listing and its reissuable/quantity/
  // decimals-derived "is this an NFT" classification were removed
  int32 sequence_in_block = 5;
  int32 height = 6;
  bytes id = 7;
  string name = 8;
  string description = 9;
}

message DataEntry {
  oneof value {
    int64 int_value = 1;
    bool bool_value = 2;
    bytes binary_value = 3;
    string string_value = 4;
  }
}

message LeaseDetails {
  message Cancelled {
    int32 height = 1;
    bytes transaction_id = 2;
  }

  message Expired {
    int32 height = 1;
  }

  bytes sender_public_key = 1;
  Recipient recipient = 2;
  int64 amount = 3;
  bytes source_id = 4;
  int32 height = 5;

  oneof cancel_reason {
    Cancelled cancelled = 11;
    Expired expired = 12;
  }
}

message LeaseIds {
  repeated bytes ids = 1;
}
