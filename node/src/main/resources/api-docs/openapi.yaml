openapi: 3.1.0
info:
  version: '{{version}}'
  title: Hearth Full Node ({{networkId}})
  description: >-
    The Hearth node REST API is the main interface for interacting with the
    blockchain: reading blocks, accounts, assets and leases, inspecting
    finality and generation periods, and signing or broadcasting transactions.


    All binary values (transaction and block ids, asset ids, public keys,
    signatures, proofs, attachments) are hex encoded. Addresses are bech32m
    with a network specific human readable part (`hrth` on mainnet, `thrth`
    on testnet, `shrth` on stagenet).


    Endpoints that return monetary amounts also accept
    `Accept: application/json;large-significand-format=string`, which renders
    those amounts as strings so clients without 64 bit integers do not lose
    precision. Those responses are documented as a separate
    `application/json;large-significand-format=string` content type.
  termsOfService: ''
  license:
    name: MIT License
    url: 'https://github.com/hearthchain/node-jvm/blob/HEAD/LICENSE'
servers:
  - url: /
tags:
  - name: addresses
    description: Account balances, wallet accounts and address utilities
  - name: blocks
    description: Blocks and block headers by height, id or generator
  - name: peers
    description: Peer discovery, connections and the ban list
  - name: blockchain
    description: >-
      Block reward and emission curve, finality and generation periods, and the
      Reserve and Settle ledger
  - name: generators
    description: Generators committed for a generation period
  - name: transactions
    description: Reading, signing and broadcasting transactions
  - name: utils
    description: Hashing, seed generation, node time and transaction serialization
  - name: assets
    description: Issued asset details, balances and distribution
  - name: leasing
    description: Active and historical leases
  - name: activation
    description: Blockchain feature voting and activation status
  - name: debug
    description: >-
      Node internals and operator tools. Most of these require an API key and
      some of them alter the node's state.
  - name: node
    description: Node version, status and shutdown
paths:
  /addresses:
    get:
      tags:
        - addresses
      summary: Wallet addresses
      description: Get a list of account addresses in the node wallet
      operationId: getWalletAddresses
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
    post:
      tags:
        - addresses
      summary: Create wallet address
      description: Generate a new account address in the node wallet
      operationId: createWalletAddress
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                required:
                  - address
                type: object
                properties:
                  address:
                    $ref: '#/components/schemas/Address'
        '403':
          $ref: '#/components/responses/ApiKeyNotValid'
      security:
        - APIKey: [ ]
  '/addresses/{address}':
    delete:
      tags:
        - addresses
      summary: Delete
      description: 'Remove the account with address {address} from the wallet'
      operationId: deleteWalletAddress
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                required:
                  - deleted
                type: object
                properties:
                  deleted:
                    type: boolean
        '403':
          $ref: '#/components/responses/ApiKeyNotValid'
      security:
        - APIKey: [ ]
  '/addresses/seq/{from}/{to}':
    get:
      tags:
        - addresses
      summary: Wallet addresses by range
      description: >-
        Get a list of addresses in the node wallet by a given range of indices.
        Max range {from}-{to} is 1000 addresses.
      operationId: getWalletAddressesRange
      parameters:
        - name: from
          in: path
          description: Start index
          required: true
          schema:
            type: integer
        - name: to
          in: path
          description: End index (not included)
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
  '/addresses/bls/{address}':
    get:
      tags:
        - addresses
      summary: BLS public key
      description: >-
        Get the endorser (BLS) public key of one of this node's generators, so
        that an operator can see what a commitment from this node would
        register. Only the accounts listed in `hearth.miner.accounts` have one:
        the wallet itself holds no BLS keys.
      operationId: getBlsPublicKeyByAddress
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                required:
                  - blsPublicKey
                type: object
                properties:
                  blsPublicKey:
                    $ref: '#/components/schemas/BlsPublicKey'
        '400':
          description: The address is not one of this node's generators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: 115
                message: no private key for sender address in wallet
  '/addresses/publicKey/{publicKey}':
    get:
      tags:
        - addresses
      summary: Address from a public key
      description: Generate an address from a given public key
      operationId: getAddressByPublicKey
      parameters:
        - name: publicKey
          in: path
          description: Public key hex encoded
          required: true
          schema:
            $ref: '#/components/schemas/PublicKey'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                required:
                  - address
                type: object
                properties:
                  address:
                    $ref: '#/components/schemas/Address'
  '/addresses/validate/{address}':
    get:
      tags:
        - addresses
      summary: Validate
      description: 'Check whether address {address} is valid or not'
      operationId: validateAddress
      parameters:
        - name: address
          in: path
          description: Address to check
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                required:
                  - address
                  - valid
                type: object
                properties:
                  address:
                    type: string
                  valid:
                    type: boolean
  '/addresses/balance/{address}':
    get:
      tags:
        - addresses
      summary: Regular balance
      description: Get the regular balance in HRTH at a given address
      operationId: getRegularBalance
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
            application/json;large-significand-format=string:
              schema:
                $ref: '#/components/schemas/BalanceLSF'
  /addresses/balance:
    get:
      tags:
        - addresses
      summary: Multiple accounts balances
      description: >-
        Get balances for multiple addresses. For dozens of addresses, better use
        the POST method. Max number of addresses is set by
        `hearth.rest-api.transactions-by-address-limit`, 1000 by default.
      operationId: getMultipleBalances
      parameters:
        - name: address
          in: query
          description: Addresses bech32m encoded
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 1000
            items:
              $ref: '#/components/schemas/Address'
        - name: height
          in: query
          description: >-
            For balance at height requests. Max number of blocks back from the
            current height is set by `hearth.db.max-rollback-depth`, 2000 by
            default.
          schema:
            $ref: '#/components/schemas/Height'
        - name: asset
          in: query
          description: Hex encoded asset id. Omit for HRTH.
          schema:
            $ref: '#/components/schemas/AssetId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressBalance'
            application/json;large-significand-format=string:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressBalanceLSF'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - addresses
      summary: Multiple accounts balances
      description: >-
        Get balances for multiple addresses. Max number of addresses is set by
        `hearth.rest-api.transactions-by-address-limit`, 1000 by default.
      operationId: getMultipleBalancesViaPost
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - addresses
              properties:
                addresses:
                  type: array
                  description: Addresses bech32m encoded
                  items:
                    $ref: '#/components/schemas/Address'
                  minItems: 1
                  maxItems: 1000
                height:
                  allOf:
                    - $ref: '#/components/schemas/Height'
                  description: >-
                    For balance at height requests. Max number of blocks back
                    from the current height is set by
                    `hearth.db.max-rollback-depth`, 2000 by default.
                asset:
                  $ref: '#/components/schemas/HearthOrAssetId'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressBalance'
            application/json;large-significand-format=string:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressBalanceLSF'
        '400':
          $ref: '#/components/responses/BadRequest'
  '/addresses/balance/details/{address}':
    get:
      tags:
        - addresses
      summary: All types of balances in HRTH
      description: Get the available, regular, generating and effective balance
      operationId: getHearthBalances
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceDetails'
            application/json;large-significand-format=string:
              schema:
                $ref: '#/components/schemas/BalanceDetailsLSF'
  '/addresses/balance/{address}/{confirmations}':
    get:
      tags:
        - addresses
      summary: Confirmed regular balance in HRTH
      description: >-
        Get the minimum regular balance at a given address for {confirmations}
        blocks back from the current height. Max number of confirmations is set
        by `hearth.db.max-rollback-depth`, 2000 by default.
      operationId: getConfirmedRegularBalance
      parameters:
        - $ref: '#/components/parameters/address'
        - name: confirmations
          in: path
          description: Number of blocks
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
            application/json;large-significand-format=string:
              schema:
                $ref: '#/components/schemas/BalanceLSF'
        '400':
          $ref: '#/components/responses/BadRequest'
  '/addresses/effectiveBalance/{address}':
    get:
      tags:
        - addresses
      summary: Effective balance
      description: Get the effective balance in HRTH at a given address
      operationId: getEffectiveBalance
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
            application/json;large-significand-format=string:
              schema:
                $ref: '#/components/schemas/BalanceLSF'
  '/addresses/effectiveBalance/{address}/{confirmations}':
    get:
      tags:
        - addresses
      summary: Confirmed effective balance in HRTH
      description: >-
        Get the minimum effective balance at a given address for
        {confirmations} blocks back from the current height. Max number of
        confirmations is set by `hearth.db.max-rollback-depth`, 2000 by default.
      operationId: getConfirmedEffectiveBalance
      parameters:
        - $ref: '#/components/parameters/address'
        - name: confirmations
          in: path
          description: Number of blocks
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
            application/json;large-significand-format=string:
              schema:
                $ref: '#/components/schemas/BalanceLSF'
        '400':
          $ref: '#/components/responses/BadRequest'
  '/blocks/{id}':
    get:
      tags:
        - blocks
      summary: Block by ID
      description: Get a block by its ID
      operationId: getBlockById
      parameters:
        - $ref: '#/components/parameters/blockId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Block'
            application/json;large-significand-format=string:
              schema:
                $ref: '#/components/schemas/BlockLSF'
        '404':
          $ref: '#/components/responses/BlockDoesNotExist'
  '/blocks/at/{height}':
    get:
      tags:
        - blocks
      summary: Block at height
      description: Get a block at a given height
      operationId: getBlockByHeight
      parameters:
        - $ref: '#/components/parameters/height'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Block'
            application/json;large-significand-format=string:
              schema:
                $ref: '#/components/schemas/BlockLSF'
        '404':
          $ref: '#/components/responses/BlockDoesNotExist'
  /blocks/last:
    get:
      tags:
        - blocks
      summary: Last block
      description: Get the block at the current blockchain height
      operationId: getLastBlock
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Block'
            application/json;large-significand-format=string:
              schema:
                $ref: '#/components/schemas/BlockLSF'
  '/blocks/seq/{from}/{to}':
    get:
      tags:
        - blocks
      summary: Block range
      description: >-
        Get blocks at a given range of heights. Max range {from}-{to} is limited
        by `hearth.rest-api.blocks-request-limit`, 100 by default.
      operationId: getBlocksRange
      parameters:
        - name: from
          in: path
          description: Start block height
          required: true
          schema:
            $ref: '#/components/schemas/Height'
        - name: to
          in: path
          description: End block height
          required: true
          schema:
            $ref: '#/components/schemas/Height'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Block'
            application/json;large-significand-format=string:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockLSF'
        '400':
          $ref: '#/components/responses/BadRequest'
  '/blocks/address/{address}/{from}/{to}':
    get:
      tags:
        - blocks
      summary: Blocks forged by address
      description: >-
        Get a list of blocks forged by a given address. Max range {from}-{to} is
        limited by `hearth.rest-api.blocks-request-limit`, 100 by default.
      operationId: getBlocksByAddress
      parameters:
        - $ref: '#/components/parameters/address'
        - name: from
          in: path
          description: Start block height
          required: true
          schema:
            $ref: '#/components/schemas/Height'
        - name: to
          in: path
          description: End block height
          required: true
          schema:
            $ref: '#/components/schemas/Height'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Block'
            application/json;large-significand-format=string:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockLSF'
        '400':
          $ref: '#/components/responses/BadRequest'
  '/blocks/delay/{id}/{blockNum}':
    get:
      tags:
        - blocks
      summary: Average block delay
      description: >-
        Average delay in milliseconds between the last `blockNum` blocks
        starting from the block with `id`
      operationId: getBlockDelay
      parameters:
        - $ref: '#/components/parameters/blockId'
        - name: blockNum
          in: path
          description: Number of blocks to count delay over
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                required:
                  - delay
                type: object
                properties:
                  delay:
                    type: integer
                    format: int64
        '404':
          $ref: '#/components/responses/BlockDoesNotExist'
  /blocks/height:
    get:
      tags:
        - blocks
      summary: Blockchain height
      description: Get the current blockchain height
      operationId: getHeight
      responses:
        '200':
          $ref: '#/components/responses/Height'
  /blocks/height/finalized:
    get:
      tags:
        - blocks
      summary: Finalized blockchain height
      description: Get the current finalized blockchain height
      operationId: getFinalizedHeight
      responses:
        '200':
          $ref: '#/components/responses/Height'
  '/blocks/height/{id}':
    get:
      tags:
        - blocks
      summary: Block height
      description: Get the height of a block by its ID
      operationId: getBlockHeightById
      parameters:
        - $ref: '#/components/parameters/blockId'
      responses:
        '200':
          $ref: '#/components/responses/Height'
        '404':
          $ref: '#/components/responses/BlockDoesNotExist'
  '/blocks/heightByTimestamp/{timestamp}':
    get:
      tags:
        - blocks
      summary: Blockchain height for timestamp
      description: >-
        Get the height of the most recent block whose timestamp does not exceed
        the given `{timestamp}`
      operationId: getHeightByTimestamp
      parameters:
        - name: timestamp
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Timestamp'
      responses:
        '200':
          $ref: '#/components/responses/Height'
        '400':
          description: >-
            The timestamp is in the future or before the genesis block
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: 199
                message: Indicated timestamp belongs to the future
  '/blocks/finalized/at/{height}':
    get:
      tags:
        - blocks
      summary: Finalized height at blockchain height
      description: Get the finalized height as of a given blockchain height
      operationId: getFinalizedHeightAt
      parameters:
        - $ref: '#/components/parameters/height'
      responses:
        '200':
          $ref: '#/components/responses/Height'
        '404':
          description: Not finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: 406
                message: Not finalized
  '/blocks/headers/at/{height}':
    get:
      tags:
        - blocks
      summary: Block headers at height
      description: Get block headers at a given height
      operationId: getBlockHeadersByHeight
      parameters:
        - $ref: '#/components/parameters/height'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockHeader'
            application/json;large-significand-format=string:
              schema:
                $ref: '#/components/schemas/BlockHeaderLSF'
        '404':
          $ref: '#/components/responses/BlockDoesNotExist'
  /blocks/headers/last:
    get:
      tags:
        - blocks
      summary: Last block headers
      description: Get headers of the block at the current blockchain height
      operationId: getLastBlockHeaders
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockHeader'
            application/json;large-significand-format=string:
              schema:
                $ref: '#/components/schemas/BlockHeaderLSF'
  /blocks/headers/finalized:
    get:
      tags:
        - blocks
      summary: Finalized block headers
      description: Get headers of the finalized block
      operationId: getFinalizedBlockHeaders
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockHeader'
            application/json;large-significand-format=string:
              schema:
                $ref: '#/components/schemas/BlockHeaderLSF'
  '/blocks/headers/seq/{from}/{to}':
    get:
      tags:
        - blocks
      summary: Block headers at range
      description: >-
        Get block headers at a given range of heights. Max range {from}-{to} is
        limited by `hearth.rest-api.blocks-request-limit`, 100 by default.
      operationId: getBlockHeadersRange
      parameters:
        - name: from
          in: path
          description: Start block height
          required: true
          schema:
            $ref: '#/components/schemas/Height'
        - name: to
          in: path
          description: End block height
          required: true
          schema:
            $ref: '#/components/schemas/Height'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockHeader'
            application/json;large-significand-format=string:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockHeaderLSF'
        '400':
          $ref: '#/components/responses/BadRequest'
  '/blocks/headers/{id}':
    get:
      tags:
        - blocks
      summary: Block headers by ID
      description: Get headers of a given block
      operationId: getBlockHeadersById
      parameters:
        - $ref: '#/components/parameters/blockId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockHeader'
            application/json;large-significand-format=string:
              schema:
                $ref: '#/components/schemas/BlockHeaderLSF'
        '404':
          $ref: '#/components/responses/BlockDoesNotExist'
  '/generators/at/{height}':
    get:
      tags:
        - generators
      summary: Generators at height
      description: >-
        Get the generators committed for the generation period that contains a
        given height. Only the current period and the next one are available.
      operationId: getGeneratorsAtHeight
      parameters:
        - $ref: '#/components/parameters/height'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeneratorData'
            application/json;large-significand-format=string:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeneratorDataLSF'
        '404':
          description: >-
            The height is outside the current and next generation periods
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              example: [ ]
  /peers/all:
    get:
      tags:
        - peers
      summary: Peer list
      description: >-
        Get a list of all ever known, not banned peers with a publicly available
        declared address
      operationId: getPeers
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                required:
                  - peers
                type: object
                properties:
                  peers:
                    type: array
                    items:
                      required:
                        - address
                        - lastSeen
                      type: object
                      properties:
                        address:
                          type: string
                          example: /127.0.0.1:6868
                        lastSeen:
                          $ref: '#/components/schemas/Timestamp'
  /peers/connected:
    get:
      tags:
        - peers
      summary: Connected peers list
      description: Get a list of all peers currently connected to the node
      operationId: getConnectedPeers
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                required:
                  - peers
                type: object
                properties:
                  peers:
                    type: array
                    items:
                      required:
                        - address
                        - applicationName
                        - applicationVersion
                        - declaredAddress
                        - peerName
                        - peerNonce
                      type: object
                      properties:
                        address:
                          type: string
                        declaredAddress:
                          type: string
                          description: '`N/A` when the peer declares no address'
                        peerName:
                          type: string
                        peerNonce:
                          type: integer
                          format: int64
                        applicationName:
                          type: string
                        applicationVersion:
                          type: string
                          example: 1.0.0
  /peers/blacklisted:
    get:
      tags:
        - peers
      summary: Ban list
      description: Get a list of all currently banned peers of the node
      operationId: getBannedPeers
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  required:
                    - hostname
                    - reason
                    - timestamp
                  type: object
                  properties:
                    hostname:
                      type: string
                    timestamp:
                      $ref: '#/components/schemas/Timestamp'
                    reason:
                      type: string
  /peers/suspended:
    get:
      tags:
        - peers
      summary: Suspended peers list
