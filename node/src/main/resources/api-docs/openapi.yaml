  /transactions/sign:
    post:
      tags:
        - transactions
      summary: Sign transaction on behalf of wallet account
      description: >-
        Sign a transaction with the private key corresponding to `sender`. The
        sender must exist in the node wallet. If `timestamp` is omitted, the
        node's current time is used, and `senderPublicKey` is filled in from the
        signing key.


        A CommitToGeneration request is the exception: it is signed with, and
        filled in from, the generator keys in `hearth.miner.accounts` rather
        than the wallet, so `senderPublicKey`, `endorserPublicKey`,
        `vrfPublicKey`, `commitmentSignature` and `vrfCommitmentSignature` are
        all overwritten, and `generationPeriodStart` defaults to the next
        generation period.
      operationId: signTx
      requestBody:
        description: Transaction data in JSON including `type` and `sender`
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/ApiKeyNotValid'
      security:
        - APIKey: [ ]
