        (Settle transactions)
      operationId: getSettlement
      parameters:
        - name: client
          in: path
          description: Address that sent the Reserve transactions
          required: true
          schema:
            $ref: '#/components/schemas/Address'
        - name: miner
          in: path
          description: TEE miner address the funds were reserved against
          required: true
          schema:
            $ref: '#/components/schemas/Address'
        - $ref: '#/components/parameters/assetId'
      responses:
        '200':
          description: >-
            successful operation. Both counters are 0 for an unknown triple.
          content:
