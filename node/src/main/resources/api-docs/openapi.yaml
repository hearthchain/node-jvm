  /activation/status:
    get:
      tags:
        - activation
      summary: Feature activation status
      description: Activation statuses of blockchain features
      operationId: getFeatureStatuses
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                required:
                  - features
                  - height
                  - nextCheck
                  - votingInterval
                  - votingThreshold
                type: object
                properties:
                  height:
                    allOf:
                      - $ref: '#/components/schemas/Height'
                    description: Current blockchain height on the node
                  votingInterval:
                    type: integer
                    format: int32
                    description: Voting period length in blocks
                  votingThreshold:
                    type: integer
                    format: int32
                    description: Number of blocks that support a feature to approve it
                  nextCheck:
                    allOf:
                      - $ref: '#/components/schemas/Height'
                    description: Next height at which feature statuses are recalculated
                  features:
                    type: array
                    items:
                      required:
                        - blockchainStatus
                        - description
                        - id
                        - nodeStatus
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int32
                          description: Feature ID
                        description:
                          type: string
                        blockchainStatus:
                          type: string
                          enum:
                            - VOTING
                            - APPROVED
                            - ACTIVATED
                          description: Feature status on the blockchain
                        nodeStatus:
                          type: string
                          enum:
                            - NOT_IMPLEMENTED
                            - IMPLEMENTED
                            - VOTED
                          description: Support for the feature on this node
                        activationHeight:
                          $ref: '#/components/schemas/Height'
                        supportingBlocks:
                          type: integer
                          format: int32
                          description: >-
                            Number of blocks in the current voting window that
                            support the feature. Present only while the feature
                            status is undefined.
