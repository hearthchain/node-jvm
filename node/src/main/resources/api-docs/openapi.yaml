      description: >-
        Broadcast a signed transaction. The body is either transaction data in
        JSON including `type` and `proofs`, or a raw protobuf encoded
        `SignedTransaction` message. The encoding is selected by the
        `Content-Type` header; a request without one is read as JSON. The
        response is JSON in both cases.
      operationId: broadcastSignedTx
      requestBody:
        content:
          application/json:
            schema:
