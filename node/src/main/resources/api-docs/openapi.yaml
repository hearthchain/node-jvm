        - debug
      summary: Validate transaction
      description: >-
        Validate a transaction against the current state without broadcasting
        it, and measure the time spent in milliseconds. Use the JSON
        transaction format with proofs.
      operationId: validateTx
      requestBody:
        description: Signed transaction
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'
        required: true
      responses:
        '200':
          description: >-
            successful operation. On success the validated transaction's fields
            are merged into the response; on failure `error` and `transaction`
            are returned instead.
          content:
            application/json:
              schema:
                required:
                  - valid
                  - validationTime
                  - height
                type: object
                properties:
                  valid:
                    type: boolean
                  validationTime:
                    type: integer
                    format: int64
                    description: Milliseconds spent validating
                  height:
                    $ref: '#/components/schemas/Height'
                  error:
                    type: string
                    description: Present when `valid` is false
                  transaction:
                    allOf:
                      - $ref: '#/components/schemas/Transaction'
                    description: Present when `valid` is false
