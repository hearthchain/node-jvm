          application/x-protobuf:
            schema:
              type: string
              format: binary
          application/protobuf:
            schema:
              type: string
              format: binary
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
            application/json;large-significand-format=string:
              schema:
                $ref: '#/components/schemas/TransactionLSF'
