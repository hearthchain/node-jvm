components:
  schemas:
    Timestamp:
      type: integer
      format: int64
      minimum: 0
      description: Milliseconds since the Unix epoch
      example: 1760000000000
    Height:
      type: integer
      format: int32
      minimum: 1
      example: 1610000
    Hash:
      type: string
      description: 32 bytes, hex encoded
      pattern: '^[0-9a-fA-F]{64}$'
      example: b62629c304f5ce5391a40e4b75242f648c51b1fadfaf5429bd48d21d2ab2aad1
    Signature:
      type: string
      description: Ed25519 signature, 64 bytes, hex encoded
      pattern: '^[0-9a-fA-F]{128}$'
      example: 55e7948f71888e7c95bd2090d71e72096672045d6d592a5f9f1df4d7e8765a77eddc2cb1c3b22cabe7463b8ffe938a1ed9522f238036b92f05e53ef8577c6c8d
    Proof:
      type: string
      description: Ed25519 signature over the transaction body bytes, 64 bytes, hex encoded
      pattern: '^[0-9a-fA-F]{128}$'
    Amount:
      type: integer
      format: int64
      minimum: 0
    AmountString:
      type: string
      description: Amount rendered as a decimal string
      pattern: '^(0|[1-9]\d*)$'
      example: '1200'
    AssetId:
      title: AssetId
      description: Asset identifier, the id of the transaction that issued it
      allOf: # Generators can't handle this: https://github.com/OpenAPITools/openapi-generator/issues/21469
        - $ref: '#/components/schemas/Hash'
    HearthOrAssetId:
      description: Asset identifier. Absence or null means HRTH, the native asset.
      anyOf:
        - type: 'null'
        - $ref: '#/components/schemas/AssetId'
    BlockId:
      description: Hash of the protobuf encoded block header
      allOf:
        - $ref: '#/components/schemas/Hash'
      example: 06357ce4475ab4b83928e65fe07319efbde451531b95ccc3fdb573170c3b2738
    TransactionId:
      allOf:
        - $ref: '#/components/schemas/Hash'
      example: 8e62d4ff5d7f8dfe9664cb2c01da3bab114e7d265bdddddfa3b57eba41bb7d41
    LeaseId:
      description: Lease ID, the id of the Lease transaction that created it
      allOf:
        - $ref: '#/components/schemas/TransactionId'
    AssetName:
      type: string
      minLength: 4
      maxLength: 16
    AssetDescription:
      type: string
      maxLength: 1000
    AssetDecimals:
      type: integer
      minimum: 0
      maximum: 8
      example: 2
    NetworkId:
      type: string
      description: >-
        The bech32m human readable part of the network this transaction belongs
        to: `hrth` on mainnet, `thrth` on testnet, `shrth` on stagenet
      pattern: '^[a-z]{1,83}$'
      example: thrth
    Address:
      type: string
      description: bech32m, human readable part per network
      pattern: '^[a-z]+1[qpzry9x8gf2tvdw0s3jn54khce6mua7l]{38}$'
      example: thrth1n5wdnt28q9q2g4ekklzgx93t6he5uajgyntvc8
    PublicKey:
      type: string
      description: Ed25519 public key, 32 bytes, hex encoded
      pattern: '^[0-9a-fA-F]{64}$'
      example: 18656ba6d7862cb11d995afe20bf8761edee05ec28aa29bfbcf31ebd19dede71
    BlsPublicKey:
      type: string
      description: BLS12-381 public key, 48 bytes, hex encoded
      pattern: '^[0-9a-fA-F]{96}$'
      example: 8dbf77df79479e11e99011f5ebc66b0d160ceddf2fcecfade325f07e96213f0d5d47a9af5a7ce3314f532e6aa03a33db
    BlsSignature:
      type: string
      description: BLS12-381 signature, 96 bytes, hex encoded
      pattern: '^[0-9a-fA-F]{192}$'
      example: 866931dd65be36cdea5240c2c4fe7dd75956c3e060845b83661bdb2d62b7a09e896e0bb3900172f2d5c018cb426d94d6001c75cc1d868994d5a78db41c60d2c4fe40dd19ef2d8b684111ad6586e33817dec91fc492d2687c3c943d08dc16c89b
    VrfPublicKey:
      type: string
      description: ECVRF public key, 32 bytes, hex encoded
      pattern: '^[0-9a-fA-F]{64}$'
      example: c3b01c3a53a3441f6f7773022a4f7d7f381eb684223ceae98b8cdedf895b6113
    GeneratorIndex:
      type: integer
      format: int32
      minimum: 0
      example: 0
    HexBytes:
      type: string
      description: Arbitrary length byte string, hex encoded
      pattern: '^[0-9a-fA-F]*$'
    ApiError:
      required:
        - error
        - message
      type: object
      properties:
        error:
          type: integer
          format: int32
        message:
          type: string
    HashedMessage:
      required:
        - hash
        - message
      type: object
      properties:
        message:
          type: string
        hash:
          $ref: '#/components/schemas/Hash'
    Balance:
      required:
        - address
        - balance
        - confirmations
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        confirmations:
          type: integer
          format: int32
        balance:
          type: integer
          format: int64
    BalanceLSF:
      required:
        - address
        - balance
        - confirmations
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        confirmations:
          type: integer
          format: int32
        balance:
          $ref: '#/components/schemas/AmountString'
    AddressBalance:
      description: One entry of a multiple account balances response
      required:
        - id
        - balance
      type: object
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: The address, exactly as it was given in the request
        balance:
          type: integer
          format: int64
    AddressBalanceLSF:
      required:
        - id
        - balance
      type: object
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: The address, exactly as it was given in the request
        balance:
          $ref: '#/components/schemas/AmountString'
    BalanceDetails:
      required:
        - address
        - available
        - effective
        - generating
        - regular
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        regular:
          type: integer
          format: int64
          description: The full balance
        generating:
          type: integer
          format: int64
          description: The minimum effective balance over the generating balance depth
        available:
          type: integer
          format: int64
          description: '`regular` minus what is leased out'
        effective:
          type: integer
          format: int64
          description: '`available` plus what is leased in'
    BalanceDetailsLSF:
      required:
        - address
        - available
        - effective
        - generating
        - regular
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        regular:
          $ref: '#/components/schemas/AmountString'
        generating:
          $ref: '#/components/schemas/AmountString'
        available:
          $ref: '#/components/schemas/AmountString'
        effective:
          $ref: '#/components/schemas/AmountString'
    AssetDistribution:
      required:
        - hasNext
        - lastItem
        - items
      type: object
      properties:
        hasNext:
          type: boolean
        lastItem:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
        items:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: map of address to balance
          example:
            thrth1n5wdnt28q9q2g4ekklzgx93t6he5uajgyntvc8: 15
            thrth1cp9d5vzsd0e247r6jz3c3gava3234awk20gkgz: 25
    AssetDistributionLSF:
      required:
        - hasNext
        - lastItem
        - items
      type: object
      properties:
        hasNext:
          type: boolean
        lastItem:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
        items:
          type: object
          additionalProperties:
            type: string
          description: map of address to balance
          example:
            thrth1n5wdnt28q9q2g4ekklzgx93t6he5uajgyntvc8: '15'
            thrth1cp9d5vzsd0e247r6jz3c3gava3234awk20gkgz: '25'
    AssetDetails:
      type: object
      required:
        - assetId
        - issueHeight
        - issueTimestamp
        - name
        - description
        - decimals
        - quantity
        - sequenceInBlock
        - minAssetFee
      properties:
        assetId:
          $ref: '#/components/schemas/AssetId'
        issueHeight:
          $ref: '#/components/schemas/Height'
        issueTimestamp:
          type: integer
          format: int64
          description: >-
            Always 0. No transaction type issues an asset, so there is no issue
            timestamp to report; the field is kept for compatibility.
          example: 0
        name:
          $ref: '#/components/schemas/AssetName'
        description:
          $ref: '#/components/schemas/AssetDescription'
        decimals:
          $ref: '#/components/schemas/AssetDecimals'
        quantity:
          type: integer
          format: int64
          description: Total supply of the asset
        sequenceInBlock:
          type: integer
          format: int32
          description: Position of the asset within the block that introduced it
        minAssetFee:
          type: integer
          format: int64
          description: Minimum fee payable in this asset
    AssetDetailsLSF:
      type: object
      required:
        - assetId
        - issueHeight
        - issueTimestamp
        - name
        - description
        - decimals
        - quantity
        - sequenceInBlock
        - minAssetFee
      properties:
        assetId:
          $ref: '#/components/schemas/AssetId'
        issueHeight:
          $ref: '#/components/schemas/Height'
        issueTimestamp:
          type: integer
          format: int64
          example: 0
        name:
          $ref: '#/components/schemas/AssetName'
        description:
          $ref: '#/components/schemas/AssetDescription'
        decimals:
          $ref: '#/components/schemas/AssetDecimals'
        quantity:
          $ref: '#/components/schemas/AmountString'
        sequenceInBlock:
          type: integer
          format: int32
        minAssetFee:
          type: integer
          format: int64
    AssetBalanceAndDetails:
      description: >-
        One asset in an account portfolio. Only `assetId` is present for an
        asset the node has no description for.
      required:
        - assetId
      type: object
      properties:
        assetId:
          $ref: '#/components/schemas/AssetId'
        balance:
          type: integer
          format: int64
          description: Account balance in the asset
        quantity:
          type: integer
          format: int64
          description: Total supply of the asset
        sequenceInBlock:
          type: integer
          format: int32
    AssetBalanceAndDetailsLSF:
      required:
        - assetId
      type: object
      properties:
        assetId:
          $ref: '#/components/schemas/AssetId'
        balance:
          $ref: '#/components/schemas/AmountString'
        quantity:
          $ref: '#/components/schemas/AmountString'
        sequenceInBlock:
          type: integer
          format: int32
    AssetBalancesResponse:
      required:
        - address
        - balances
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        balances:
          type: array
          items:
            $ref: '#/components/schemas/AssetBalanceAndDetails'
    AssetBalancesResponseLSF:
      required:
        - address
        - balances
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        balances:
          type: array
          items:
            $ref: '#/components/schemas/AssetBalanceAndDetailsLSF'
    ConflictEndorsement:
      type: object
      required:
        - endorserIndex
        - finalizedBlockId
        - finalizedHeight
        - signature
      description: >-
        An endorsement that voted for a different finalized block than the one
        the aggregate endorses
      properties:
        endorserIndex:
          $ref: '#/components/schemas/GeneratorIndex'
        finalizedBlockId:
          $ref: '#/components/schemas/BlockId'
        finalizedHeight:
          $ref: '#/components/schemas/Height'
        signature:
          $ref: '#/components/schemas/BlsSignature'
    FinalizationVoting:
      type: object
      description: >-
        The finality votes carried by a block header. Fields are omitted when
        empty: `endorserIndexes` and `aggregatedEndorsementSignature` when no
        endorsement was aggregated, `finalizedHeight` when it is 0, and
        `conflictEndorsements` when there is no conflict.
      properties:
        endorserIndexes:
          type: array
          description: Indexes, into the period's generator list, of the endorsers whose signatures were aggregated
          items:
            $ref: '#/components/schemas/GeneratorIndex'
        aggregatedEndorsementSignature:
          $ref: '#/components/schemas/BlsSignature'
        finalizedHeight:
          $ref: '#/components/schemas/Height'
        conflictEndorsements:
          type: array
          items:
            $ref: '#/components/schemas/ConflictEndorsement'
      example:
        endorserIndexes: [ 0, 2 ]
        aggregatedEndorsementSignature: 866931dd65be36cdea5240c2c4fe7dd75956c3e060845b83661bdb2d62b7a09e896e0bb3900172f2d5c018cb426d94d6001c75cc1d868994d5a78db41c60d2c4fe40dd19ef2d8b684111ad6586e33817dec91fc492d2687c3c943d08dc16c89b
        finalizedHeight: 1609990
    ChallengedHeader:
      type: object
      description: >-
        The header of the block this one challenges, present only in a challenging block
      required:
        - headerSignature
        - features
        - generator
        - generatorPublicKey
      properties:
        headerSignature:
          $ref: '#/components/schemas/Signature'
        features:
          type: array
          items:
            type: integer
            format: int32
        generator:
          $ref: '#/components/schemas/Address'
        generatorPublicKey:
          $ref: '#/components/schemas/PublicKey'
        stateHash:
          $ref: '#/components/schemas/Hash'
        finalizationVoting:
          $ref: '#/components/schemas/FinalizationVoting'
    BlockHeaderBase:
      type: object
      required:
        - timestamp
        - reference
        - transactionsRoot
        - id
        - baseTarget
        - generationSignature
        - features
        - generator
        - generatorPublicKey
        - signature
        - blocksize
        - transactionCount
        - height
        - totalFee
      properties:
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        reference:
          allOf:
            - $ref: '#/components/schemas/BlockId'
          description: ID of the previous block
        transactionsRoot:
          allOf:
            - $ref: '#/components/schemas/Hash'
          description: Root of the merkle tree over this block's transactions
        id:
          $ref: '#/components/schemas/BlockId'
        baseTarget:
          type: integer
          format: int64
        generationSignature:
          allOf:
            - $ref: '#/components/schemas/HexBytes'
          description: The VRF proof this block's hit source was derived from
        features:
          type: array
          description: Feature ids this block votes for
          items:
            type: integer
            format: int32
        generator:
          $ref: '#/components/schemas/Address'
        generatorPublicKey:
          $ref: '#/components/schemas/PublicKey'
        stateHash:
          allOf:
            - $ref: '#/components/schemas/Hash'
          description: Present once state hashes are enabled on the chain
        challengedHeader:
          $ref: '#/components/schemas/ChallengedHeader'
        finalizationVoting:
          $ref: '#/components/schemas/FinalizationVoting'
        signature:
          $ref: '#/components/schemas/Signature'
        blocksize:
          type: integer
          format: int32
        transactionCount:
          type: integer
          format: int32
        height:
          $ref: '#/components/schemas/Height'
        VRF:
          allOf:
            - $ref: '#/components/schemas/HexBytes'
          description: The hit source this block was generated from
    BlockHeader:
      allOf:
        - $ref: '#/components/schemas/BlockHeaderBase'
        - type: object
          properties:
            totalFee:
              type: integer
              format: int64
              description: Sum of this block's transaction fees payable in HRTH
            reward:
              type: integer
              format: int64
              description: Block reward credited at this height
            rewardShares:
              type: object
              additionalProperties:
                type: integer
                format: int64
              description: map of address to its share of the block reward
              example:
                thrth1n5wdnt28q9q2g4ekklzgx93t6he5uajgyntvc8: 200000000
                thrth1cp9d5vzsd0e247r6jz3c3gava3234awk20gkgz: 100000000
    BlockHeaderLSF:
      allOf:
        - $ref: '#/components/schemas/BlockHeaderBase'
        - type: object
          properties:
            totalFee:
              $ref: '#/components/schemas/AmountString'
            reward:
              $ref: '#/components/schemas/AmountString'
            rewardShares:
              type: object
              additionalProperties:
                type: string
              description: map of address to its share of the block reward
              example:
                thrth1n5wdnt28q9q2g4ekklzgx93t6he5uajgyntvc8: '200000000'
                thrth1cp9d5vzsd0e247r6jz3c3gava3234awk20gkgz: '100000000'
    Block:
      allOf:
        - $ref: '#/components/schemas/BlockHeader'
        - type: object
          required:
            - fee
            - transactions
          properties:
            fee:
              type: integer
              format: int64
              description: Sum of this block's transaction fees payable in HRTH
            transactions:
              type: array
              items:
                $ref: '#/components/schemas/TransactionInBlock'
    BlockLSF:
      allOf:
        - $ref: '#/components/schemas/BlockHeaderLSF'
        - type: object
          required:
            - fee
            - transactions
          properties:
            fee:
              $ref: '#/components/schemas/AmountString'
            transactions:
              type: array
              items:
                $ref: '#/components/schemas/TransactionInBlockLSF'
    AssetPair:
      type: object
      required:
        - amountAsset
        - priceAsset
      properties:
        amountAsset:
          $ref: '#/components/schemas/HearthOrAssetId'
        priceAsset:
          $ref: '#/components/schemas/HearthOrAssetId'
    Order:
      type: object
      required:
        - version
        - id
        - sender
        - senderPublicKey
        - matcherPublicKey
        - assetPair
        - orderType
        - amount
        - price
        - timestamp
        - expiration
        - matcherFee
        - signature
        - proofs
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
          maximum: 4
        id:
          $ref: '#/components/schemas/Hash'
        sender:
          allOf:
            - $ref: '#/components/schemas/Address'
          readOnly: true
        senderPublicKey:
          $ref: '#/components/schemas/PublicKey'
        matcherPublicKey:
          $ref: '#/components/schemas/PublicKey'
        assetPair:
          $ref: '#/components/schemas/AssetPair'
        orderType:
          type: string
          enum:
            - buy
            - sell
        amount:
          $ref: '#/components/schemas/Amount'
        price:
          $ref: '#/components/schemas/Amount'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        expiration:
          $ref: '#/components/schemas/Timestamp'
        matcherFee:
          $ref: '#/components/schemas/Amount'
        signature:
          allOf:
            - $ref: '#/components/schemas/Signature'
          description: The first proof, for compatibility
        proofs:
          type: array
          items:
            $ref: '#/components/schemas/Proof'
        matcherFeeAssetId:
          allOf:
            - $ref: '#/components/schemas/HearthOrAssetId'
          description: Order version 3 and above only
        attachment:
          $ref: '#/components/schemas/HexBytes'
    OrderLSF:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            amount:
              $ref: '#/components/schemas/AmountString'
            price:
              $ref: '#/components/schemas/AmountString'
            matcherFee:
              $ref: '#/components/schemas/AmountString'
    ApplicationStatus:
      type: string
      enum:
        - succeeded
        - script_execution_failed
        - elided
      description: |
        * `succeeded`: the transaction was applied
        * `script_execution_failed`: the transaction was rejected after its fee was charged
        * `elided`: the transaction was recorded but not applied
    TransactionBase:
      type: object
      required:
        - type
        - id
        - fee
        - timestamp
        - networkId
        - sender
        - senderPublicKey
        - proofs
      properties:
        type:
          type: integer
          minimum: 1
          maximum: 11
          description: Transaction type id
        id:
          allOf:
            - $ref: '#/components/schemas/TransactionId'
          readOnly: true
        fee:
          $ref: '#/components/schemas/Amount'
        feeAssetId:
          allOf:
            - $ref: '#/components/schemas/HearthOrAssetId'
          description: >-
            Only Transfer, Reserve and Withdraw can pay a fee in a custom asset;
            null for every other type
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        networkId:
          $ref: '#/components/schemas/NetworkId'
        sender:
          allOf:
            - $ref: '#/components/schemas/Address'
          readOnly: true
        senderPublicKey:
          $ref: '#/components/schemas/PublicKey'
        proofs:
          type: array
          description: >-
            Proofs authorising the transaction. The first one must be the
            sender's signature over the body bytes.
          items:
            $ref: '#/components/schemas/Proof'
    TransactionBaseLSF:
      allOf:
        - $ref: '#/components/schemas/TransactionBase'
        - type: object
          properties:
            fee:
              $ref: '#/components/schemas/AmountString'
    TransferTransaction:
      title: TransferTransaction
      description: >-
        Transfers an asset to one or more recipients. Type 1.
      type: object
      required:
        - transfers
        - attachment
        - transferCount
        - totalAmount
      properties:
        assetId:
          allOf:
            - $ref: '#/components/schemas/HearthOrAssetId'
          description: Asset being transferred
        transfers:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required:
              - recipient
              - amount
            properties:
              recipient:
                $ref: '#/components/schemas/Address'
              amount:
                $ref: '#/components/schemas/Amount'
        transferCount:
          type: integer
          format: int32
          readOnly: true
        totalAmount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          readOnly: true
        attachment:
          allOf:
            - $ref: '#/components/schemas/HexBytes'
          description: Up to 140 bytes, so up to 280 hex characters
    TransferTransactionLSF:
      title: TransferTransactionLSF
      allOf:
        - $ref: '#/components/schemas/TransferTransaction'
        - type: object
          properties:
            totalAmount:
              $ref: '#/components/schemas/AmountString'
    ExchangeTransaction:
      title: ExchangeTransaction
      description: Settles a matched pair of orders. Type 2.
      type: object
      required:
        - order1
        - order2
        - amount
        - price
        - buyMatcherFee
        - sellMatcherFee
      properties:
        order1:
          $ref: '#/components/schemas/Order'
        order2:
          $ref: '#/components/schemas/Order'
        amount:
          $ref: '#/components/schemas/Amount'
        price:
          $ref: '#/components/schemas/Amount'
        buyMatcherFee:
          $ref: '#/components/schemas/Amount'
        sellMatcherFee:
          $ref: '#/components/schemas/Amount'
    ExchangeTransactionLSF:
      title: ExchangeTransactionLSF
      type: object
      required:
        - order1
        - order2
        - amount
        - price
        - buyMatcherFee
        - sellMatcherFee
      properties:
        order1:
          $ref: '#/components/schemas/OrderLSF'
        order2:
          $ref: '#/components/schemas/OrderLSF'
        amount:
          $ref: '#/components/schemas/AmountString'
        price:
          $ref: '#/components/schemas/AmountString'
        buyMatcherFee:
          $ref: '#/components/schemas/AmountString'
        sellMatcherFee:
          $ref: '#/components/schemas/AmountString'
    LeaseTransaction:
      title: LeaseTransaction
      description: >-
        Leases HRTH to a recipient, raising their generating balance without
        transferring ownership. Type 3.
      type: object
      required:
        - amount
        - recipient
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        recipient:
          $ref: '#/components/schemas/Address'
    LeaseTransactionLSF:
      title: LeaseTransactionLSF
      type: object
      required:
        - amount
        - recipient
      properties:
        amount:
          $ref: '#/components/schemas/AmountString'
        recipient:
          $ref: '#/components/schemas/Address'
    LeaseCancelTransaction:
      title: LeaseCancelTransaction
      description: Cancels an active lease. Type 4.
      type: object
      required:
        - leaseId
      properties:
        leaseId:
          $ref: '#/components/schemas/LeaseId'
        lease:
          allOf:
            - $ref: '#/components/schemas/LeaseInfo'
          description: >-
            The cancelled lease, added by the node when the transaction is read
            back. Not part of the signed transaction.
          readOnly: true
    LeaseCancelTransactionLSF:
      title: LeaseCancelTransactionLSF
      type: object
      required:
        - leaseId
      properties:
        leaseId:
          $ref: '#/components/schemas/LeaseId'
        lease:
          allOf:
            - $ref: '#/components/schemas/LeaseInfoLSF'
          readOnly: true
    CommitToGenerationTransaction:
      title: CommitToGenerationTransaction
      description: >-
        Registers the sender as a generator for one generation period,
        committing to the VRF key its blocks are verified against and the BLS
        key its endorsements are signed with. Type 5.
      type: object
      required:
        - endorserPublicKey
        - vrfPublicKey
        - generationPeriodStart
        - commitmentSignature
        - vrfCommitmentSignature
      properties:
        endorserPublicKey:
          $ref: '#/components/schemas/BlsPublicKey'
        vrfPublicKey:
          $ref: '#/components/schemas/VrfPublicKey'
        generationPeriodStart:
          allOf:
            - $ref: '#/components/schemas/Height'
          description: First height of the generation period being committed to
        commitmentSignature:
          allOf:
            - $ref: '#/components/schemas/BlsSignature'
          description: Proof of possession of the BLS secret key
        vrfCommitmentSignature:
          allOf:
            - $ref: '#/components/schemas/HexBytes'
          description: Proof of possession of the VRF secret key
    StartBoostTransaction:
      title: StartBoostTransaction
      description: >-
        Registers an attested TEE enclave as a boosted miner for one generation
        period, by submitting its Intel TDX quote. Type 6.
      type: object
      required:
        - validator
        - tdxQuote
        - generationPeriodStart
      properties:
        validator:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: Address of the validator this enclave is operated for
        tdxQuote:
          allOf:
            - $ref: '#/components/schemas/HexBytes'
          description: >-
            Raw Intel TDX attestation quote, several kilobytes. Verified against
            the collateral registered by UpdateCollateral transactions.
        generationPeriodStart:
          allOf:
            - $ref: '#/components/schemas/Height'
          description: First height of the generation period being registered for
    ReserveTransaction:
      title: ReserveTransaction
      description: >-
        Locks an amount of an issued asset against a registered TEE miner, to be
        drawn down by that miner's Settle transactions. Accumulative. Type 7.
      type: object
      required:
        - assetId
        - amount
        - miner
      properties:
        assetId:
          allOf:
            - $ref: '#/components/schemas/AssetId'
          description: HRTH is not reservable, so this is always an issued asset
        amount:
          $ref: '#/components/schemas/Amount'
        miner:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: TEE miner the funds are reserved with
    ReserveTransactionLSF:
      title: ReserveTransactionLSF
      allOf:
        - $ref: '#/components/schemas/ReserveTransaction'
        - type: object
          properties:
            amount:
              $ref: '#/components/schemas/AmountString'
    BindApiKeyTransaction:
      title: BindApiKeyTransaction
      description: >-
        Binds an HPKE sealed API key envelope to a registered enclave's
        attestation key. The envelope is opaque to the node. Type 8.
      type: object
      required:
        - enclavePublicKey
        - encryptedApiKey
      properties:
        enclavePublicKey:
          $ref: '#/components/schemas/PublicKey'
        encryptedApiKey:
          allOf:
            - $ref: '#/components/schemas/HexBytes'
          description: HPKE sealed envelope
    SettleTransaction:
      title: SettleTransaction
      description: >-
        A TEE miner submits an enclave signed batch of cumulative client spends,
        retiring the settled portion of what each client reserved with it. Type 9.
      type: object
      required:
        - enclavePublicKey
        - settlements
        - enclaveSignature
      properties:
        enclavePublicKey:
          $ref: '#/components/schemas/PublicKey'
        settlements:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Settlement'
        enclaveSignature:
          allOf:
            - $ref: '#/components/schemas/Signature'
          description: Enclave signature over the settlement batch preimage
    Settlement:
      type: object
      required:
        - client
        - assetId
        - cumulativeSpent
      properties:
        client:
          $ref: '#/components/schemas/Address'
        assetId:
          allOf:
            - $ref: '#/components/schemas/AssetId'
          description: HRTH is not settleable, so this is always an issued asset
        cumulativeSpent:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Total spent by this client so far, not a delta
    WithdrawTransaction:
      title: WithdrawTransaction
      description: >-
        Type 10. Wire format only: it has no validation or state semantics yet,
        is rejected with `UnsupportedTransactionType` before any state change,
        and cannot be signed through `/transactions/sign`.
      type: object
      required:
        - fromMiner
        - amount
      properties:
        fromMiner:
          $ref: '#/components/schemas/Address'
        assetId:
          $ref: '#/components/schemas/HearthOrAssetId'
        amount:
          $ref: '#/components/schemas/Amount'
    WithdrawTransactionLSF:
      title: WithdrawTransactionLSF
      allOf:
        - $ref: '#/components/schemas/WithdrawTransaction'
        - type: object
          properties:
            amount:
              $ref: '#/components/schemas/AmountString'
    UpdateCollateralTransaction:
      title: UpdateCollateralTransaction
      description: >-
        Permissionless upsert of the Intel DCAP collateral that StartBoost
        quotes are verified against. Every field is independently optional and
        null when unset; at least one must be present. Type 11.
      type: object
      properties:
        rootCaCrl:
          allOf:
            - $ref: '#/components/schemas/HexBytes'
          description: Intel Root CA CRL, DER encoded
        pckCrl:
          allOf:
            - $ref: '#/components/schemas/HexBytes'
          description: PCK CRL, DER encoded
        tcbInfo:
          allOf:
            - $ref: '#/components/schemas/HexBytes'
          description: Signed JSON TCB Info for one platform model
        qeIdentity:
          allOf:
            - $ref: '#/components/schemas/HexBytes'
          description: Signed JSON QE Identity
        tcbSigningIssuerChain:
          allOf:
            - $ref: '#/components/schemas/HexBytes'
          description: >-
            PEM issuer chain for tcbInfo and qeIdentity, TCB Signing Cert to
            Intel Root CA
        pckCaIssuerChain:
          allOf:
            - $ref: '#/components/schemas/HexBytes'
          description: >-
            PEM issuer chain for pckCrl, PCK Platform or Processor CA to Intel
            Root CA
    Transaction:
      description: >-
        A transaction, as signed and broadcast. `type` selects which of the
        variants below applies.
      allOf:
        - $ref: '#/components/schemas/TransactionBase'
        - oneOf:
            - $ref: '#/components/schemas/TransferTransaction'
            - $ref: '#/components/schemas/ExchangeTransaction'
            - $ref: '#/components/schemas/LeaseTransaction'
            - $ref: '#/components/schemas/LeaseCancelTransaction'
            - $ref: '#/components/schemas/CommitToGenerationTransaction'
            - $ref: '#/components/schemas/StartBoostTransaction'
            - $ref: '#/components/schemas/ReserveTransaction'
            - $ref: '#/components/schemas/BindApiKeyTransaction'
            - $ref: '#/components/schemas/SettleTransaction'
            - $ref: '#/components/schemas/WithdrawTransaction'
            - $ref: '#/components/schemas/UpdateCollateralTransaction'
    TransactionLSF:
      allOf:
        - $ref: '#/components/schemas/TransactionBaseLSF'
        - oneOf:
            - $ref: '#/components/schemas/TransferTransactionLSF'
            - $ref: '#/components/schemas/ExchangeTransactionLSF'
            - $ref: '#/components/schemas/LeaseTransactionLSF'
            - $ref: '#/components/schemas/LeaseCancelTransactionLSF'
            - $ref: '#/components/schemas/CommitToGenerationTransaction'
            - $ref: '#/components/schemas/StartBoostTransaction'
            - $ref: '#/components/schemas/ReserveTransactionLSF'
            - $ref: '#/components/schemas/BindApiKeyTransaction'
            - $ref: '#/components/schemas/SettleTransaction'
            - $ref: '#/components/schemas/WithdrawTransactionLSF'
            - $ref: '#/components/schemas/UpdateCollateralTransaction'
    TransactionInBlock:
      description: A transaction as it appears inside a block
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          required:
            - applicationStatus
          properties:
            applicationStatus:
              $ref: '#/components/schemas/ApplicationStatus'
    TransactionInBlockLSF:
      allOf:
        - $ref: '#/components/schemas/TransactionLSF'
        - type: object
          required:
            - applicationStatus
          properties:
            applicationStatus:
              $ref: '#/components/schemas/ApplicationStatus'
    TransactionWithMeta:
      description: >-
        A confirmed transaction with the metadata the node records alongside it.
        A Lease transaction also carries `status`, and a LeaseCancel carries
        `lease`.
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          required:
            - height
            - applicationStatus
            - spentComplexity
          properties:
            height:
              allOf:
                - $ref: '#/components/schemas/Height'
              description: Height of the block containing the transaction
            applicationStatus:
              $ref: '#/components/schemas/ApplicationStatus'
            spentComplexity:
              type: integer
              format: int64
            status:
              allOf:
                - $ref: '#/components/schemas/LeaseStatus'
              description: Lease transactions only
    TransactionWithMetaLSF:
      allOf:
        - $ref: '#/components/schemas/TransactionLSF'
        - type: object
          required:
            - height
            - applicationStatus
            - spentComplexity
          properties:
            height:
              $ref: '#/components/schemas/Height'
            applicationStatus:
              $ref: '#/components/schemas/ApplicationStatus'
            spentComplexity:
              type: integer
              format: int64
            status:
              $ref: '#/components/schemas/LeaseStatus'
    TransactionStatus:
      type: object
      required:
        - id
        - status
      properties:
        id:
          $ref: '#/components/schemas/TransactionId'
        status:
          type: string
          enum:
            - confirmed
            - unconfirmed
            - not_found
          description: |
            * `not_found`: the transaction is unknown to this node
            * `unconfirmed`: the transaction is in the UTX pool
            * `confirmed`: the transaction is in a block or microblock
        height:
          allOf:
            - $ref: '#/components/schemas/Height'
          description: Confirmed transactions only
        confirmations:
          type: integer
          format: int32
          description: >-
            Confirmed transactions only: blocks added on top of the one that
            contains the transaction
        applicationStatus:
          allOf:
            - $ref: '#/components/schemas/ApplicationStatus'
          description: Confirmed transactions only
        spentComplexity:
          type: integer
          format: int64
          description: Confirmed transactions only
    TransactionMerkleProofs:
      required:
        - id
        - merkleProof
        - transactionIndex
      type: object
      properties:
        id:
          $ref: '#/components/schemas/TransactionId'
        transactionIndex:
          type: integer
          format: int32
          description: Sequential number of the transaction in the block
        merkleProof:
          type: array
          description: Sibling hashes of the merkle tree, bottom to top
          items:
            $ref: '#/components/schemas/Hash'
    LeaseStatus:
      type: string
      enum:
        - active
        - canceled
      description: |
        * `active`: the lease is active
        * `canceled`: the lease has been cancelled or has expired
    LeaseInfo:
      required:
        - id
        - originTransactionId
        - sender
        - recipient
        - amount
        - height
        - status
      type: object
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/LeaseId'
          description: Lease ID
        originTransactionId:
          allOf:
            - $ref: '#/components/schemas/TransactionId'
          description: ID of the Lease transaction that created the lease
        sender:
          $ref: '#/components/schemas/Address'
        recipient:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: Lease recipient address
        amount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Leased HRTH amount
        height:
          allOf:
            - $ref: '#/components/schemas/Height'
          description: Height of the block that contains the origin transaction
        status:
          $ref: '#/components/schemas/LeaseStatus'
        cancelHeight:
          oneOf:
            - $ref: '#/components/schemas/Height'
            - type: 'null'
          description: Height of the block that cancelled or expired the lease
        cancelTransactionId:
          oneOf:
            - $ref: '#/components/schemas/TransactionId'
            - type: 'null'
          description: ID of the LeaseCancel transaction that cancelled the lease
    LeaseInfoLSF:
      allOf:
        - $ref: '#/components/schemas/LeaseInfo'
        - type: object
          properties:
            amount:
              $ref: '#/components/schemas/AmountString'
    RewardStatus:
      type: object
      required:
        - height
        - totalHearthAmount
        - currentReward
        - cEmit
        - halfLifeBlocks
        - remainingToCap
        - daoAddress
      properties:
        height:
          $ref: '#/components/schemas/Height'
        totalHearthAmount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Total HRTH in existence at this height
        currentReward:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Block reward at this height, including the work boost
        cEmit:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Total supply emitted as a forging reward over the curve's lifetime
        halfLifeBlocks:
          type: integer
          format: int64
          description: >-
            How many blocks the reward takes to halve. Documentation only, not
            consensus relevant.
        remainingToCap:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: >-
            `hardCap - totalHearthAmount`: how much of the hard cap has not yet
            been minted
        daoAddress:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
          description: Address receiving the DAO share of the reward, if configured
    RewardStatusLSF:
      allOf:
        - $ref: '#/components/schemas/RewardStatus'
        - type: object
          properties:
            totalHearthAmount:
              $ref: '#/components/schemas/AmountString'
            currentReward:
              $ref: '#/components/schemas/AmountString'
            cEmit:
              $ref: '#/components/schemas/AmountString'
            remainingToCap:
              $ref: '#/components/schemas/AmountString'
    GenerationPeriod:
      type: object
      required:
        - start
        - end
      properties:
        start:
          $ref: '#/components/schemas/Height'
        end:
          $ref: '#/components/schemas/Height'
    RegisteredEnclaveData:
      type: object
      description: >-
        A TEE miner's enclave registered for the period via StartBoost, as of
        `height` rather than `finalizedHeight`
      required:
        - enclavePublicKey
        - validator
        - operator
      properties:
        enclavePublicKey:
          allOf:
            - $ref: '#/components/schemas/PublicKey'
          description: >-
            The enclave's ephemeral public key, from the quote's report data
        validator:
          $ref: '#/components/schemas/Address'
        operator:
          $ref: '#/components/schemas/Address'
    NextGeneratorData:
      type: object
      required:
        - address
        - transactionId
      properties:
        address:
          $ref: '#/components/schemas/Address'
        transactionId:
          oneOf:
            - $ref: '#/components/schemas/TransactionId'
            - type: 'null'
          description: >-
            null for a generator committed by the genesis snapshot, which has no
            commitment transaction
    GeneratorData:
      type: object
      required:
        - address
        - transactionId
      properties:
        address:
          $ref: '#/components/schemas/Address'
        transactionId:
          oneOf:
            - $ref: '#/components/schemas/TransactionId'
            - type: 'null'
          description: >-
            null for a generator committed by the genesis snapshot, which has no
            commitment transaction
        balance:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Generating balance the generator was committed with
        conflictHeight:
          allOf:
            - $ref: '#/components/schemas/Height'
          description: >-
            Height at which this generator produced a conflicting endorsement,
            if any
    GeneratorDataLSF:
      allOf:
        - $ref: '#/components/schemas/GeneratorData'
        - type: object
          properties:
            balance:
              $ref: '#/components/schemas/AmountString'
    FinalityInfoBase:
      type: object
      required:
        - height
        - finalizedHeight
        - currentGenerationPeriod
        - nextGenerationPeriod
        - nextGenerators
        - currentRegisteredEnclaves
        - nextRegisteredEnclaves
      properties:
        height:
          $ref: '#/components/schemas/Height'
        finalizedHeight:
          $ref: '#/components/schemas/Height'
        currentGenerationPeriod:
          oneOf:
            - $ref: '#/components/schemas/GenerationPeriod'
            - type: 'null'
        nextGenerationPeriod:
          oneOf:
            - $ref: '#/components/schemas/GenerationPeriod'
            - type: 'null'
        nextGenerators:
          type: array
          items:
            $ref: '#/components/schemas/NextGeneratorData'
        currentRegisteredEnclaves:
          type: array
          description: >-
            A StartBoost registration always targets the next period, so this
            list is what the previous period registered
          items:
            $ref: '#/components/schemas/RegisteredEnclaveData'
        nextRegisteredEnclaves:
          type: array
          items:
            $ref: '#/components/schemas/RegisteredEnclaveData'
    FinalityInfo:
      allOf:
        - $ref: '#/components/schemas/FinalityInfoBase'
        - type: object
          required:
            - currentGenerators
          properties:
            currentGenerators:
              type: array
              items:
                $ref: '#/components/schemas/GeneratorData'
    FinalityInfoLSF:
      allOf:
        - $ref: '#/components/schemas/FinalityInfoBase'
        - type: object
          required:
            - currentGenerators
          properties:
            currentGenerators:
              type: array
              items:
                $ref: '#/components/schemas/GeneratorDataLSF'
    NextCommittedGenerator:
      type: object
      required:
        - publicKey
        - blsPublicKey
        - vrfPublicKey
      properties:
        publicKey:
          $ref: '#/components/schemas/PublicKey'
        blsPublicKey:
          $ref: '#/components/schemas/BlsPublicKey'
        vrfPublicKey:
          $ref: '#/components/schemas/VrfPublicKey'
    TransactionSnapshot:
      type: object
      description: Every state entry a transaction changed
      required:
        - applicationStatus
        - balances
        - leaseBalances
        - assetStatics
        - assetVolumes
        - newLeases
        - cancelledLeases
        - orderFills
        - nextCommittedGenerators
      properties:
        applicationStatus:
          $ref: '#/components/schemas/ApplicationStatus'
        balances:
          type: array
          items:
            type: object
            required:
              - address
              - asset
              - balance
            properties:
              address:
                $ref: '#/components/schemas/Address'
              asset:
                $ref: '#/components/schemas/HearthOrAssetId'
              balance:
                type: integer
                format: int64
        leaseBalances:
          type: array
          items:
            type: object
            required:
              - address
              - in
              - out
            properties:
              address:
                $ref: '#/components/schemas/Address'
              in:
                type: integer
                format: int64
              out:
                type: integer
                format: int64
        assetStatics:
          type: array
          items:
            type: object
            required:
              - id
              - decimals
              - name
              - description
            properties:
              id:
                $ref: '#/components/schemas/AssetId'
              decimals:
                $ref: '#/components/schemas/AssetDecimals'
              name:
                $ref: '#/components/schemas/AssetName'
              description:
                $ref: '#/components/schemas/AssetDescription'
        assetVolumes:
          type: array
          items:
            type: object
            required:
              - id
              - volume
            properties:
              id:
                $ref: '#/components/schemas/AssetId'
              volume:
                type: integer
                format: int64
        newLeases:
          type: array
          items:
            type: object
            required:
              - id
              - sender
              - recipient
              - amount
              - txId
              - height
            properties:
              id:
                $ref: '#/components/schemas/LeaseId'
              sender:
                $ref: '#/components/schemas/PublicKey'
              recipient:
                $ref: '#/components/schemas/Address'
              amount:
                type: integer
                format: int64
              txId:
                $ref: '#/components/schemas/TransactionId'
              height:
                $ref: '#/components/schemas/Height'
        cancelledLeases:
          type: array
          items:
            type: object
            required:
              - id
              - txId
              - height
            properties:
              id:
                $ref: '#/components/schemas/LeaseId'
              txId:
                $ref: '#/components/schemas/TransactionId'
              height:
                $ref: '#/components/schemas/Height'
        orderFills:
          type: array
          items:
            type: object
            required:
              - id
              - volume
              - fee
            properties:
              id:
                $ref: '#/components/schemas/Hash'
              volume:
                type: integer
                format: int64
              fee:
                type: integer
                format: int64
        nextCommittedGenerators:
          type: array
          items:
            $ref: '#/components/schemas/NextCommittedGenerator'
    DebugStateHashes:
      type: object
      description: Hashes representing the blockchain state at a specific block
      required:
        - stateHash
        - hearthBalanceHash
        - assetBalanceHash
        - leaseBalanceHash
        - leaseStatusHash
        - nextCommittedGeneratorsHash
        - committedGeneratorBalancesHash
        - snapshotHash
        - blockId
        - baseTarget
        - height
        - version
      properties:
        stateHash:
          $ref: '#/components/schemas/Hash'
        hearthBalanceHash:
          $ref: '#/components/schemas/Hash'
        assetBalanceHash:
          $ref: '#/components/schemas/Hash'
        leaseBalanceHash:
          $ref: '#/components/schemas/Hash'
        leaseStatusHash:
          $ref: '#/components/schemas/Hash'
        nextCommittedGeneratorsHash:
          $ref: '#/components/schemas/Hash'
        committedGeneratorBalancesHash:
          $ref: '#/components/schemas/Hash'
        snapshotHash:
          $ref: '#/components/schemas/Hash'
        blockId:
          $ref: '#/components/schemas/BlockId'
        baseTarget:
          type: integer
          format: int64
        height:
          $ref: '#/components/schemas/Height'
        version:
          type: string
          description: Node version that computed the hashes
  responses:
    Height:
      description: Block height
      content:
        application/json:
          schema:
            type: object
            required:
              - height
            properties:
              height:
                $ref: '#/components/schemas/Height'
    ApiKeyNotValid:
      description: Provided API key is not correct
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: 2
            message: Provided API key is not correct
    BadRequest:
      description: The request cannot be fulfilled due to bad syntax
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BlockDoesNotExist:
      description: The block does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: 301
            message: block does not exist
    TransactionDoesNotExist:
      description: The transaction does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: 311
            message: transactions does not exist
  parameters:
    address:
      name: address
      in: path
      description: Address bech32m encoded
      required: true
      schema:
        $ref: '#/components/schemas/Address'
    assetId:
      name: assetId
      in: path
      description: Asset ID hex encoded
      required: true
      schema:
        $ref: '#/components/schemas/AssetId'
    blockId:
      name: id
      in: path
      description: Block ID hex encoded
      required: true
      schema:
        $ref: '#/components/schemas/BlockId'
    txId:
      name: id
      in: path
      description: Transaction ID hex encoded
      required: true
      schema:
        $ref: '#/components/schemas/TransactionId'
    txIdQuery:
      name: id
      in: query
      description: Transaction IDs hex encoded
      required: true
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TransactionId'
        minItems: 1
        maxItems: 1000
    height:
      name: height
      in: path
      description: Block height
      required: true
      schema:
        $ref: '#/components/schemas/Height'
  requestBodies:
    TransactionIds:
      description: >-
        Transaction IDs, either as a JSON body with an `ids` array or as
        repeated `id` form fields
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - ids
            properties:
              ids:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionId'
                minItems: 1
                maxItems: 1000
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              id:
                type: array
