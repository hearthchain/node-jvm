# Address feature character. Used to prevent mixing up addresses from different networks.
address-scheme-character = "C"

# Timestamps/heights of activation/deactivation of different functions.
functionality {
  # Blocks period for feature checking and activation
  feature-check-blocks-period = 10000

  # Blocks required to accept feature
  blocks-for-feature-activation = 9000

  reset-effective-balances-at-height = 0
  generation-balance-depth-from-50-to-1000-after-height = 0
  block-version-3-after-height = 0
  max-transaction-time-back-offset = 120m
  max-transaction-time-forward-offset = 90m
  pre-activated-features {
    # 1 = 100
    # 2 = 200
  }
  lease-expiration = 1000000
  min-block-time = 15s
  delay-delta = 8

  # Fill new block header fields (state hash and challenged header)
  # only specified number of blocks after the Light Node blockchain feature activation
  light-node-block-fields-absence-interval = 1000

  ## Deterministic finality

  # Max valid endorsers in a finalization header
  # max-valid-endorsers = 128

  # generation-period-length = 1000
}

# Block rewards settings
rewards {
  term = 100000
  initial = 600000000
  min-increment = 50000000
  voting-interval = 10000
}

# The genesis block header. It carries no transactions: the state it puts into an empty node comes entirely from
# the height-1 entry of predefined-snapshots below.
genesis {
  # Timestamp of the genesis block
  timestamp = 1460678400000

  # Genesis block signature
  signature = "BASE58BLOCKSIGNATURE"

  # Hash of the height-1 predefined snapshot, and id of the genesis block built from it. Both are checked on start:
  # a node whose settings produce anything else refuses to run instead of building its own chain. Take them from
  # the output of GenesisBlockGenerator, together with the rest of this section.
  state-hash = "BASE58STATEHASH"
  block-id = "BASE58BLKHASH"

  # Initial base target
  initial-base-target = 153722867

  # Average delay between blocks
  average-block-delay = 60s
}

# Predefined state snapshots, applied outside of transaction processing before the block at each entry's height
# applies its own transactions. Since there is no issue transaction, this is the only way to mint a new asset; it
# can also credit asset balances and commit generators. Only the height-1 (genesis) entry may credit Waves - Waves
# supply growth beyond genesis is tracked as block rewards only, so a later entry crediting Waves is rejected. This
# is a plain height-keyed lookup, not tied to feature activation in code - a network's config typically lines a
# snapshot's height up with a feature activation height, but that's a config-authoring convention, not something the
# node enforces. The height-1 entry is the genesis snapshot; if omitted, the node builds an empty genesis rather than
# refusing to start, so always provide one for a real network.
predefined-snapshots = [
  {
    height = 1

    # Assets issued by this snapshot. Since there is no issue transaction to derive it from, the id is explicit.
    # The whole quantity must be handed out in the balances below.
    assets = [
      # {id = "BASE58ASSETID", issuer = "BASE58PUBLICKEY", name = "Asset", description = "", decimals = 8, quantity = 100000000, reissuable = false}
    ]

    # Accounts committed to generating blocks from the very first generation period.
    # Requires the DeterministicFinality feature to be pre-activated at height 1 or below.
    generators = [
      # {public-key = "BASE58PUBLICKEY", endorser-public-key = "BASE58BLSPUBLICKEY"}
    ]

    # Balances credited by this snapshot. `waves` is in smallest units; `assets` maps an asset id from the list
    # above to an amount.
    balances = [
      {recipient = "ADDRESS1", waves = 50000000000000},
      {recipient = "ADDRESS2", waves = 50000000000000}
      # {recipient = "ADDRESS3", waves = 100000, assets {BASE58ASSETID = 100000000}}
    ]
  }
  # {height = 1000, assets = [...], balances = [...]} # e.g. a new asset minted alongside a feature activation
]
