hearth {
  directory = /var/lib/hearth

  blockchain {
    type: CUSTOM
    custom {
      address-scheme-character: "R"
      functionality {
        feature-check-blocks-period = 5
        blocks-for-feature-activation = 5
        pre-activated-features = {
          1 = 0
        }
        max-transaction-time-back-offset = 120m
        max-transaction-time-forward-offset = 90m
        min-block-time = 5s
        # No CommitToGeneration ever renews the single genesis-committed generator below for a later period, so
        # this has to stay large enough that the node never mines past the period the genesis commitment covers -
        # same reasoning and same value as node-it's own fixtures (see CLAUDE.md, "node-it fixtures").
        generation-period-length = 1000000
      }
      genesis {
        average-block-delay: 10000ms
        initial-base-target: 1240
        timestamp: 1786958340908
        block-timestamp: 1786958340908
        signature: "bd8c76703ed0ccf5ddf95c7ecfc4131fe52822af64391d444cedd985b017adcb463d956e8b30519097ad9a6219219cea14aa2d0aeadbc8a02715aa79ecbf4d08"
        state-hash: "cceac83023398b25ecd0dd5565e08ea178a476af66e5f7d29d8d817d4d0ac7f3"
        block-id: "98dad961163ace7ba9c3a04d8fb41b146b8c67f8aebcbf9f7563b3bd0e99776e"
      }
      # The only account this network ever commits as a generator, funded and pre-committed here so the node can
      # mine immediately - nothing about it is special beyond that; see docker/private/README.md for how to add
      # more accounts, or predefined DCAP collateral, to this same entry.
      predefined-snapshots = [
        {
          height = 1
          generators = [
            {
              public-key = "50decceb63cef2556136626d6c553ac2803337efbcd8d6cc81dc3edd928fc972"
              endorser-public-key = "926112be3fd0cac7fdbe6f39dcb202279b19d4d773105a0cc946d2c976982e3aa5534ea30560d6f13dffabaa75483a15"
              vrf-public-key = "2cb5d20d24154da7166c93a5bdb13bb4ba7bbf61d18db496315d30e1b2ac6430"
            }
          ]
          balances = [
            {recipient = "phrth1gxv7se8ueq623ukgwxmesapatdmhay84f0sfk0", hearth = 1000000000000000000}
          ]
        }
      ]
      rewards {
        c-emit = 9500000000000000
        initial-reward = 600000000
        decay-ratio-fixed = "340282366920938463463374607431768211456"
        half-life-blocks = 100000
      }
    }
  }

  network {
    bind-address = "0.0.0.0"
    port = 6860
    known-peers = []
    node-name = "Private node"
    declared-address = "127.0.0.1:6860"

    traffic-logger {
      ignore-tx-messages = [1, 2, 20, 21, 22, 24, 26, 27, 28]
      ignore-rx-messages = ${hearth.network.traffic-logger.ignore-tx-messages}
    }
  }

  # Nonce 0 of this seed is the funded, pre-committed generator above (see docker/private/README.md for how it was
  # derived) - the node's own wallet controls it as soon as it's registered via POST /addresses (nonce 0 is the
  # first address a fresh wallet generates).
  wallet {
    seed = "dc4c59ee30e9d22ea04f99d1cd0f0e2c1fec30e8c16e393c8d34e5ea953b698c"
    password = "rich"
  }

  rest-api {
    enable = yes
    bind-address = "0.0.0.0"
    port = 6869
    # secureHash("hearth-private-node") in hex - api-key-hash is Base16 now, not base58 (see api.http.ApiRoute).
    api-key-hash = "ad272bc224b17ca315703a94cb3d8be03a07315136afad31adedf2a0ffd5d88a"
    minimum-peers = 0
  }

  miner {
    enable = yes
    quorum = 0
    interval-after-last-block-then-generation-is-allowed = 999d
    no-quorum-mining-delay = 5s
    minimal-block-generation-offset = 1s
    max-transactions-in-micro-block = 500
    micro-block-interval = 1500ms
    min-micro-block-age = 0s
    # The same account committed as a generator in predefined-snapshots above - signing-key is the hex seed nonce 0
    # of wallet.seed derives (Wallet.generateAccountSeed), so the mining account and the funded wallet account are
    # the same address; vrf-key/bls-key are independent seeds, unrelated to the signing key or to each other.
    accounts = [
      {
        signing-key = "196bd8403a3cdcf4991edb4928419c71049d0c86f3707b9f441454e0888e61ad"
        vrf-key = "cf6443690b05217f3422a00a47a333554136a3168353b09bf5414288c1ed6c13"
        bls-key = "b766c281c9b58983cc09eb653fee3ba02a223bc780d6af230d5c659c9b03ac2e"
      }
    ]
    supported-features = []
  }

  # Streams block/microblock appends and rollbacks over gRPC on blockchain-updates.grpc-port (6881).
  extensions = ["tech.hearth.events.BlockchainUpdates"]
}

kamon.enable = no
metrics.enable = no

include "local.conf"
