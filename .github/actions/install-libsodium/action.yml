name: Install libsodium
description: >-
  Installs the libsodium that tech.hearth:crypto dlopens for Ed25519 and the VRF. Without it the library falls back,
  silently, to a slow pure-JVM backend, so every job that runs node code installs it first.

runs:
  using: composite
  steps:
    - name: Install libsodium (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: dpkg -s libsodium23 >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsodium23; }

    - name: Install libsodium (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: brew list libsodium >/dev/null 2>&1 || brew install libsodium

    # Upstream's MSVC build, pinned by hash. The archive's minisign signature was checked against the key published in
    # the libsodium documentation (RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3) when this hash was taken.
    - name: Install libsodium (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SODIUM_VERSION: 1.0.22
        SODIUM_SHA256: 3e03a726fac4bc09cb61d8f29d658ef7a5eca0811de59082130414f7ca2e4279
      run: |
        $zip = Join-Path $env:RUNNER_TEMP "libsodium.zip"
        Invoke-WebRequest -Uri "https://github.com/jedisct1/libsodium/releases/download/$env:SODIUM_VERSION-RELEASE/libsodium-$env:SODIUM_VERSION-msvc.zip" -OutFile $zip
        $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
        if ($actual -ne $env:SODIUM_SHA256) { throw "libsodium archive hash $actual does not match the pinned $env:SODIUM_SHA256" }
        $root = Join-Path $env:RUNNER_TEMP "libsodium"
        Expand-Archive -Path $zip -DestinationPath $root -Force
        $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'ARM64' } else { 'x64' }
        $dir = Join-Path $root "libsodium\$arch\Release\v143\dynamic"
        if (-not (Test-Path (Join-Path $dir "libsodium.dll"))) { throw "libsodium.dll not found in $dir" }
        # tech.hearth:crypto loads libsodium.dll by name, which Windows resolves through PATH among other places
        Add-Content -Path $env:GITHUB_PATH -Value $dir
